<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda de carro</title>
    <link rel="stylesheet" href="../PROJETO2/css/style.css">
</head>
<body>
    <div class="container">
        
        <!-- Cabeçalho -->
        <div class="header">
            <h2 id="frase_venda">Cadastre seu veículo para vender mais rápido!</h2>
        </div>

        <!-- Formulário -->
        <form >
            <div class="form-container">

                <!-- Cabeçalho do formulário -->
                <div class="form-header">
                    <p>Formulário</p>
                </div>

                <!-- corpo do formulário -->
                <div class="form-body"> 
                    <h1>Venda seu carro de forma fácil!</h1>
                    <p>Descreva as características do seu veículo:</p>
                 </div>

                <!-- Campo de entrada -->
                <div class="box-input">
                    <label for="title">Título do anúncio <span class="required-field">*</span></label>
                    <input type="text"
                        name ="title"
                        id="title"
                        class="block"
                        placeholder="Um título para o anúncio"
                        minlength="1"
                        maxlength="50"
                        required>
                </div>

                <!-- Preço -->
                <div class="box-input">
                    <label for="price">Preço <span class="required-field">*</span></label>
                    <input type="number"
                        name ="price"
                        id="price"
                        class="block"
                        placeholder="Preço do veículo"
                        minlength="1"
                        maxlength="50"
                        required>
                </div>


                <!-- Descrição -->
                <div class="box-input">
                    <label for="description">Descrição <span class="required-field">*</span></label>
                    <textarea name="descrition" 
                    id="description" 
                    class="block" 
                    placeholder="Coloque os detalhes do veículo">
                </textarea>
                </div>


                <!-- Marca -->
                <div class="box-input">
                    <label for="brand">Marca <span class="required-field">*</span></label>
                    <input type="text"
                        name ="brand"
                        id="brand"
                        class="block"
                        placeholder="Marca do veículo"
                        required>
                </div>

                <!-- Modelo -->
                <div class="box-input">
                    <label for="model">Modelo <span class="required-field">*</span></label>
                    <input type="text"
                        name ="model"
                        id="model"
                        class="block"
                        placeholder="Modelo do veículo"
                        required>
                </div>

                <!-- Quilometragem -->
                  <div class="box-input">
                    <label for="mileage">Quilometragem <span class="required-field">*</span></label>
                    <input type="number"
                        name ="mileage"
                        id="mileage"
                        class="block"
                        placeholder="Quilometragem do veículo"
                        required>
                </div>

                <!-- Ano de compra -->
                 <div class="box-input">
                    <label for="purchase-year">Ano de compra <span class="required-field">*</span></label>
                    <input type="date   "
                        name ="purchase-year"
                        id="purchase-year"
                        class="block"
                        required>
                </div>
                <div class="box-input">
                    <p>Tipo de câmbio:  <span class ="required-field">*</span></p>
                    <input type="radio" id="manual" name="gear">
                    <label for="manual">Manual</label><br>
                    <input type="radio" id="automatic" name="gear">
                    <label for="automatic">Automático</label><br>
                </div>

                <!-- Opcionais -->
                  <div class="optional-box">
                    <p>Opcionais:  <span class ="required-field">*</span></p>
                    <ul class="opcional-list">
                        <li>
                            <input type="checkbox" id="airbag" name="optional[]" value="airbag">
                            <label for="airbag">Airbag</label>
                        </li>
                        <li>
                            <input type="checkbox" id="alarm" name="optional[]" value="alarm">
                            <label for="alarm">Alarme</label>
                        </li>
                        <li>
                            <input type="checkbox" id="ar-condicionado" name="optional[]" value="ar-condicionado">
                            <label for="ar-condicionado">Ar Condicionado</label>
                        </li>
                        <li>
                            <input type="checkbox" id="reverse-camera" name="optional[]" value="reverse-camera">
                            <label for="reverse-camera">Câmera de Ré</label>
                        </li>
                    </ul>
                </div>

                    <!-- Recursos Adicionais -->
                  <div class="optional-box">
                    <ul class="opcional-list">
                        <li>
                            <input type="checkbox" id="lane-assist" name="optional[]" value="lane-assist">
                            <label for="lane-assist">Assistência de Faixa</label>
                        </li>
                        <li>
                            <input type="checkbox" id="keyless" name="optional[]" value="keyless">
                            <label for="keyless">Partida Keyless</label>
                        </li>
                        <li>
                            <input type="checkbox" id="smartphone" name="optional[]" value="smartphone">
                            <label for="smartphone">Integração com celular</label>
                        </li>
                        <li>
                            <input type="checkbox" id="leather-seats" name="optional[]" value="leather-seats">
                            <label for="leather-seats">Assentos de Couro</label>
                        </li>
                    </ul>
                </div>
                

                <!-- Fotos do carro -->
                <div class="box-input">
                    <p>Fotos do carro: <span class="required-field">*</span></p>
                    <input type="file" multiple accept="image/png, image/jpg" id="images" name="images"required>
                </div>
            


            <!-- Submissão -->
             <div class="submit">
                <input type="submit" value="Enviar" class="btn-submit">
             </div>
            </div>
            
        </form>
        
    </div>
    
</body>
</html>
